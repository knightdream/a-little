<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黑发 A 扳手攻击</title><style>body{background:#121928;color:#e8e8e4;font:16px system-ui;margin:28px auto;max-width:980px;padding:0 20px}h1{font-size:25px}main{display:flex;align-items:center;flex-wrap:wrap;gap:30px}canvas{max-width:100%;background:#121928;border:1px solid #344357;border-radius:12px}button,select{background:#263448;color:#fff;border:1px solid #596479;border-radius:6px;padding:9px;font:inherit;margin:4px}input{width:100%}p{color:#b1bece;line-height:1.7}small{color:#d8bd75}</style><h1>黑发 A · 扳手攻击</h1><p>24 帧单次攻击：蓄力、挥击、收招。此页面均速循环便于检查，GIF 使用挥击较快的节奏。</p><main><canvas id="cv" width="640" height="490"></canvas><section><button id="play">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><br><label>速度 <select id="speed"><option value="20">正常 20 fps</option><option value="8">慢放 8 fps</option><option value="4">逐步观察 4 fps</option></select></label><p id="counter"></p><input id="seek" type="range" min="0" max="23" value="0"><p>持扳手向前砸击，身体随动作前倾。<br>拖动滑块可检查武器轨迹。</p><small>动作预览稿，尚未接入游戏。</small></section></main><script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),imgs=[];let frame=0,running=true,last=0,elapsed=0,ready=false;
const play=document.getElementById('play'),seek=document.getElementById('seek'),speed=document.getElementById('speed');
Promise.all(Array.from({length:24},(_,i)=>new Promise((ok,no)=>{let a=new Image;imgs.push(a);a.onload=ok;a.onerror=no;a.src='attack/'+String(i).padStart(2,'0')+'.png'}))).then(()=>{ready=true;draw()});
function draw(){if(!ready)return;ctx.fillStyle='#121928';ctx.fillRect(0,0,640,490);ctx.strokeStyle='#43576b';ctx.beginPath();ctx.moveTo(12,433);ctx.lineTo(628,433);ctx.stroke();ctx.drawImage(imgs[frame],0,0);document.getElementById('counter').textContent=`第 ${frame+1} / 24 帧`;seek.value=frame}
function pause(){running=false;play.textContent='播放'}
play.onclick=()=>{running=!running;play.textContent=running?'暂停':'播放';elapsed=0};document.getElementById('prev').onclick=()=>{pause();frame=(frame+23)%24;draw()};document.getElementById('next').onclick=()=>{pause();frame=(frame+1)%24;draw()};seek.oninput=()=>{pause();frame=Number(seek.value);draw()};
function tick(t){let dt=Math.min(100,t-last);last=t;if(running&&ready){elapsed+=dt;let interval=1000/Number(speed.value);while(elapsed>=interval){elapsed-=interval;frame=(frame+1)%24}draw()}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
